services:
  - type: web
    name: mentalaundry-api
    runtime: node
    rootDir: tintoreria-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: USE_LEGACY_DEMO_SERVER
        value: "false"
      - key: EMAIL_PROVIDER
        value: brevo-api
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_CAMPAIGNS_ENABLED
        sync: false
      - key: CAMPAIGN_PROMO_END_DATE
        sync: false
      - key: CAMPAIGN_PROMO_CODE
        value: BIENVENIDO25
      - key: CAMPAIGN_WHATSAPP_DIGITS
        value: "18294487876"
      - key: CAMPAIGN_REMINDER_DELAY_DAYS
        value: "6"
